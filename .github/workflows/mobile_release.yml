name: Android Sideload Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to build
        required: true
        type: string
      release_notes:
        description: Optional plain-text notes to append to the GitHub Release
        required: false
        type: string

permissions:
  contents: write

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag must match vX.Y.Z: ${RELEASE_TAG}" >&2
            exit 1
          fi

          if ! gh api --silent "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "tag does not exist: ${RELEASE_TAG}" >&2
            exit 1
          fi

      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Fetch default branch changelog
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Version writes CHANGELOG.md after creating the tag, so the default
          # branch contains the requested tag's section while the tag checkout
          # remains the build source.
          git fetch --no-tags origin "refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: oracle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.x

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Prepare production environment
        env:
          SEQ_API_KEY: ${{ secrets.SEQ_API_KEY }}
        run: |
          cp .env.production .env

          escape_sed_replacement() {
            printf '%s' "$1" | sed 's/[&|\\]/\\&/g'
          }

          version_info="$(git rev-parse --short HEAD) ($(date '+%Y-%b-%d'))"
          version_info="$(escape_sed_replacement "${version_info}")"
          seq_api_key="$(escape_sed_replacement "${SEQ_API_KEY}")"
          sed -i "s|VERSION_PLACEHOLDER|${version_info}|g" .env
          sed -i "s|SEQ_API_KEY_PLACEHOLDER|${seq_api_key}|g" .env

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > android/key.jks
          {
            printf '%s\n' 'storeFile=../key.jks'
            printf 'storePassword=%s\n' "${KEYSTORE_PASSWORD}"
            printf 'keyAlias=%s\n' "${KEY_ALIAS}"
            printf 'keyPassword=%s\n' "${KEYSTORE_PASSWORD}"
          } > android/key.properties

      - name: Build release APK
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          build_number=$(( ${{ github.run_number }} + 100 ))
          flutter build apk --release \
            --build-name="${RELEASE_TAG#v}" \
            --build-number="${build_number}"

      - name: Prepare GitHub Release body
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          release_tags="$(gh release list --repo "${GITHUB_REPOSITORY}" --limit 1000 --json tagName --jq '.[].tagName')"
          previous_release_tag=""

          while IFS= read -r candidate; do
            [[ -n "${candidate}" ]] || continue
            [[ "${candidate}" == "${RELEASE_TAG}" ]] && continue

            if [[ "$(printf '%s\n%s\n' "${candidate}" "${RELEASE_TAG}" | sort -V | tail -n1)" != "${RELEASE_TAG}" ]]; then
              continue
            fi

            if [[ -z "${previous_release_tag}" || "$(printf '%s\n%s\n' "${previous_release_tag}" "${candidate}" | sort -V | tail -n1)" == "${candidate}" ]]; then
              previous_release_tag="${candidate}"
            fi
          done <<< "${release_tags}"

          changelog_source="$(mktemp)"
          if ! git show "origin/${DEFAULT_BRANCH}:CHANGELOG.md" > "${changelog_source}"; then
            git show "${RELEASE_TAG}:CHANGELOG.md" > "${changelog_source}"
          fi

          current_version="${RELEASE_TAG#v}"
          previous_version="${previous_release_tag#v}"

          awk \
            -v current_version="${current_version}" \
            -v previous_version="${previous_version}" \
            '
              function version_compare(left, right, left_parts, right_parts, i) {
                split(left, left_parts, ".")
                split(right, right_parts, ".")
                for (i = 1; i <= 3; i++) {
                  if ((left_parts[i] + 0) < (right_parts[i] + 0)) return -1
                  if ((left_parts[i] + 0) > (right_parts[i] + 0)) return 1
                }
                return 0
              }

              function section_version(line, wanted, value, parts, count) {
                value = line
                sub(/^##[[:space:]]+/, "", value)
                sub(/[[:space:]]+\([^)]*\)[[:space:]]*$/, "", value)
                gsub(/[^0-9.]/, " ", value)
                sub(/^[[:space:]]+/, "", value)
                sub(/[[:space:]]+$/, "", value)
                count = split(value, parts, /[[:space:]]+/)
                if (wanted == "oldest") return parts[count]
                return parts[1]
              }

              /^## v[0-9]+\.[0-9]+\.[0-9]+/ {
                newest_version = section_version($0, "newest")
                oldest_version = section_version($0, "oldest")
                if (!started) {
                  if (version_compare(oldest_version, current_version) > 0) {
                    next
                  }
                  if (previous_version != "" && version_compare(newest_version, previous_version) <= 0) {
                    next
                  }
                  started = 1
                } else if (previous_version != "" &&
                    (version_compare(oldest_version, previous_version) <= 0 &&
                     version_compare(newest_version, previous_version) >= 0 ||
                     version_compare(newest_version, previous_version) < 0)) {
                  exit
                }
              }

              started { print }
            ' "${changelog_source}" > changelog-sections.md

          {
            cat changelog-sections.md
            if [[ -n "${RELEASE_NOTES}" ]]; then
              printf '\n%s\n' "${RELEASE_NOTES}"
            fi
          } > release-body.md

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          fail_on_unmatched_files: true
          files: build/app/outputs/flutter-apk/app-release.apk
          tag_name: ${{ inputs.tag }}
          token: ${{ github.token }}
